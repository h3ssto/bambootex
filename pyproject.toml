[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bambootex"
version = "0.1.1"
description = "Convert pandas DataFrames into LaTeX/PDF tables"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/h3ssto/bambootex"

[tool.pytest.ini_options]
testpaths = ["tests"]
